name: E2E (Playwright)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: castellum
          POSTGRES_USER: castellum
          POSTGRES_PASSWORD: castellum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # CASTELLUM_ADMIN_PASSWORD_HASH must be a bcrypt hash of E2E_ADMIN_PASSWORD.
      # Store the hash as a repo secret CASTELLUM_ADMIN_PASSWORD_HASH.
      # Default E2E_ADMIN_PASSWORD is admin12345; generate a matching hash with:
      #   htpasswd -bnBC 12 "" admin12345 | tr -d ':\n' | sed 's/$2y/$2a/'
      # or any bcrypt tool at cost factor 10-12.
      - name: Build backend
        run: cd backend && ./mvnw -q -B -DskipTests package

      - name: Start backend
        env:
          SERVER_PORT: 8081
          DATABASE_URL: jdbc:postgresql://localhost:5432/castellum
          DATABASE_USERNAME: castellum
          DATABASE_PASSWORD: castellum
          CASTELLUM_ADMIN_USERNAME: admin
          # Bcrypt hash for the E2E admin password (set CASTELLUM_ADMIN_PASSWORD_HASH as a repo secret).
          # Falls back to a real bcrypt hash of "admin12345" (cost 10) when the secret is absent
          # (CI-only default). This hash bcrypt-validates against the default E2E_ADMIN_PASSWORD below.
          CASTELLUM_ADMIN_PASSWORD_HASH: ${{ secrets.CASTELLUM_ADMIN_PASSWORD_HASH || '$2a$10$KSSVUuIFRMxdvD3DmY1KHOSHBtgsAsv8iY4BjiBdwfg85WUMgJ9o.' }}
          # Viewer account drives the RBAC E2E specs (qa-sweep "viewer sign-in",
          # initial-sync "viewer sees banner but no sync button"). The backend's
          # BootstrapAdminInitializer skips the viewer when these are unset, which
          # would 401 the viewer login. Reuses the same CI-only bcrypt hash as admin
          # (it validates "admin12345"); the viewer password is identical in CI —
          # a disposable test fixture, never a production credential.
          CASTELLUM_VIEWER_USERNAME: viewer
          CASTELLUM_VIEWER_PASSWORD_HASH: ${{ secrets.CASTELLUM_VIEWER_PASSWORD_HASH || '$2a$10$KSSVUuIFRMxdvD3DmY1KHOSHBtgsAsv8iY4BjiBdwfg85WUMgJ9o.' }}
          CASTELLUM_SECURITY_JWT_SECRET: e2e-test-jwt-secret-not-used-in-production-32ch
          # Playwright serves the frontend at 127.0.0.1:5173, so the browser's
          # Origin is http://127.0.0.1:5173. The backend CORS allowlist defaults
          # to http://localhost:5173 only, which would 403 the login preflight
          # and surface as a "Network error" on the sign-in page. Allow both.
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
        run: |
          cd backend
          java -jar target/*.jar > /tmp/backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          echo "Waiting for backend on :8081..."
          DEADLINE=$(( $(date +%s) + 180 ))
          until curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; do
            if [ $(date +%s) -ge $DEADLINE ]; then
              echo "Backend did not become healthy within 180 s" >&2
              echo "----- backend.log (tail 120) -----" >&2
              tail -n 120 /tmp/backend.log >&2 || true
              exit 1
            fi
            sleep 3
          done
          echo "Backend is UP."

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_API_URL: http://localhost:8081
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'admin12345' }}
          E2E_VIEWER_USERNAME: viewer
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD || 'admin12345' }}
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Backend unit/integration tests. These run against H2 (see
  # backend/src/test/resources/application.yml), so no postgres service is needed.
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run backend tests
        run: cd backend && ./mvnw -B test

  # Frontend type-check, production build, and vitest suite.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, build, and test frontend
        run: cd frontend && npm ci && npm run build && npm test

  # Build the production Docker image and smoke-test the packaged app: it must
  # boot against postgres, serve the SPA same-origin, and ship nmap with caps.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: castellum
          POSTGRES_USER: castellum
          POSTGRES_PASSWORD: castellum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BuildKit is required: the root Dockerfile uses a `# syntax=` directive and
      # cache mounts. GitHub's ubuntu runners ship buildx.
      - name: Build image
        env:
          DOCKER_BUILDKIT: 1
        run: docker build -t castellum:ci .

      - name: Boot image and smoke-test
        run: |
          set -euo pipefail
          IMAGE=castellum:ci

          # Throwaway, ephemeral credentials — never production values. The JWT secret
          # (>= 32 bytes) and integration key (32-byte base64 AES-256) are validated at
          # boot; the admin account is bootstrapped but its login is not exercised here.
          JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
          INTEGRATION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=$(openssl rand -base64 18 | tr -d '\n')
          # bcrypt via htpasswd (apache2-utils, preinstalled on ubuntu runners).
          ADMIN_PASSWORD_HASH=$(htpasswd -bnBC 10 "" "$ADMIN_PASSWORD" | tr -d ':\n')

          # Bridge network + published port 8080 (the image EXPOSEs 8080). The container
          # reaches the postgres service — published on the runner host — via host-gateway.
          docker run -d --name castellum \
            -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e SERVER_PORT=8080 \
            -e DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/castellum \
            -e DATABASE_USERNAME=castellum \
            -e DATABASE_PASSWORD=castellum \
            -e CASTELLUM_SECURITY_JWT_SECRET="$JWT_SECRET" \
            -e CASTELLUM_INTEGRATION_KEY="$INTEGRATION_KEY" \
            -e CASTELLUM_ADMIN_USERNAME="$ADMIN_USERNAME" \
            -e CASTELLUM_ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            "$IMAGE"

          # Poll /actuator/health (public) until UP, ~90 s. A healthy status also proves
          # the app connected to postgres and ran its Flyway migrations.
          echo "Waiting for /actuator/health to report UP..."
          DEADLINE=$(( $(date +%s) + 90 ))
          until curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Image did not become healthy within 90 s" >&2
              exit 1
            fi
            sleep 3
          done
          echo "Image is UP."

          # SPA is served same-origin at / (guards the same-origin SPA-serving fix).
          curl -sf http://localhost:8080/ | grep -q 'id="root"'
          echo "SPA index served."

          # Scanner present with raw-socket caps (guards the nmap packaging fix). getcap
          # exits 0 even with no caps, so assert the cap string is actually there.
          docker run --rm --entrypoint bash "$IMAGE" \
            -c 'command -v nmap && getcap /usr/bin/nmap' | grep -q cap_net_raw
          echo "nmap present with capabilities."

      - name: Container logs
        if: failure()
        run: docker logs castellum || true
