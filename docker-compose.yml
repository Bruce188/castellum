# Optional one-command run: Postgres + Castellum (the backend serves the SPA at /).
# Reads the same .env as the native setup; DATABASE_URL is overridden to reach the db service.
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: castellum
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d castellum"]
      interval: 5s
      retries: 12

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/castellum
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    cap_add: [NET_RAW, NET_ADMIN]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
