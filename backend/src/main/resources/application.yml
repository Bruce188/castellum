spring:
  application:
    name: castellum
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

castellum:
  nvd:
    base-url: ${NVD_API_BASE_URL:https://services.nvd.nist.gov/rest/json/cves/2.0}
    api-key: ${NVD_API_KEY:}
    request-interval-millis: 6000
    results-per-page: 2000
