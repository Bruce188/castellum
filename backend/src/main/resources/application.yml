spring:
  application:
    name: castellum
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

castellum:
  nvd:
    base-url: ${NVD_API_BASE_URL:https://services.nvd.nist.gov/rest/json/cves/2.0}
    api-key: ${NVD_API_KEY:}
    request-interval-millis: 6000
    results-per-page: 2000
  epss:
    feed-url: ${EPSS_FEED_URL:https://epss.cyentia.com/epss_scores-current.csv.gz}
    timeout-seconds: 30
  kev:
    feed-url: ${KEV_FEED_URL:https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
  risk:
    refresh-cron: ${RISK_REFRESH_CRON:0 0 6 * * *}
