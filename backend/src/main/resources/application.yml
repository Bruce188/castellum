spring:
  application:
    name: castellum
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

castellum:
  security:
    jwt:
      secret: ${CASTELLUM_SECURITY_JWT_SECRET}
      ttl-seconds: 3600
    rate-limit:
      login-window-seconds: ${CASTELLUM_SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      login-max-attempts: ${CASTELLUM_SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:10}
  admin:
    username: ${CASTELLUM_ADMIN_USERNAME:}
    password-hash: ${CASTELLUM_ADMIN_PASSWORD_HASH:}
  viewer:
    username: ${CASTELLUM_VIEWER_USERNAME:}
    password-hash: ${CASTELLUM_VIEWER_PASSWORD_HASH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  nvd:
    base-url: ${NVD_API_BASE_URL:https://services.nvd.nist.gov/rest/json/cves/2.0}
    api-key: ${NVD_API_KEY:}
    request-interval-millis: 6000
    results-per-page: 2000
  epss:
    feed-url: ${EPSS_FEED_URL:https://epss.cyentia.com/epss_scores-current.csv.gz}
    timeout-seconds: 30
  kev:
    feed-url: ${KEV_FEED_URL:https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
  risk:
    refresh-cron: ${RISK_REFRESH_CRON:0 0 6 * * *}
    poll-interval-millis: ${RISK_POLL_INTERVAL_MILLIS:60000}
  scan:
    executor:
      # Bounded thread pool for @Async scan execution.
      # Max in-flight: max-pool-size + queue-capacity scans before rejection.
      core-pool-size: ${CASTELLUM_SCAN_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${CASTELLUM_SCAN_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${CASTELLUM_SCAN_EXECUTOR_QUEUE_CAPACITY:10}
    nmap:
      port-scan-host-timeout: ${CASTELLUM_SCAN_NMAP_PORT_SCAN_HOST_TIMEOUT:180s}
      ping-host-timeout: ${CASTELLUM_SCAN_NMAP_PING_HOST_TIMEOUT:30s}
      # Outer wall-clock cap on a single nmap process (seconds). Default sized for a /24;
      # raise for larger ranges (the scope guard permits up to /22).
      process-timeout-seconds: ${CASTELLUM_SCAN_NMAP_PROCESS_TIMEOUT_SECONDS:300}
  initial-sync:
    executor:
      # Single-threaded executor for the one-click initial data-sync background job.
      # queueCapacity=0: second submit hits AbortPolicy (AtomicBoolean inFlight guard fires first).
      core-pool-size: ${CASTELLUM_INITIAL_SYNC_EXECUTOR_CORE_POOL_SIZE:1}
      max-pool-size: ${CASTELLUM_INITIAL_SYNC_EXECUTOR_MAX_POOL_SIZE:1}
      queue-capacity: ${CASTELLUM_INITIAL_SYNC_EXECUTOR_QUEUE_CAPACITY:0}
  discovery:
    default-duration-seconds: ${DISCOVERY_DURATION_SECONDS:30}
    passive-sweep-cron: ${DISCOVERY_PASSIVE_SWEEP_CRON:0 0 */6 * * *}
    arp:
      proc-path: ${DISCOVERY_ARP_PATH:/proc/net/arp}
    mdns:
      service-types: ${DISCOVERY_MDNS_SERVICE_TYPES:_workstation._tcp.local.,_http._tcp.local.,_ssh._tcp.local.,_smb._tcp.local.,_printer._tcp.local.}
    pcap:
      enabled: ${DISCOVERY_PCAP_ENABLED:false}
      max-captured-neighbors: ${DISCOVERY_PCAP_MAX_CAPTURED_NEIGHBORS:50000}
    lldp:
      enabled: ${DISCOVERY_LLDP_ENABLED:false}
      max-captured-frames: ${DISCOVERY_LLDP_MAX_CAPTURED_FRAMES:1000}
    cdp:
      enabled: ${DISCOVERY_CDP_ENABLED:false}
      max-captured-frames: ${DISCOVERY_CDP_MAX_CAPTURED_FRAMES:1000}
    conn-table:
      enabled: ${DISCOVERY_CONN_TABLE_ENABLED:true}
      max-remotes: ${DISCOVERY_CONN_TABLE_MAX_REMOTES:512}
    public-device-prune:
      # TTL retention for stale PUBLIC-scope devices. Only discoveryScope=PUBLIC rows are
      # ever pruned — HOME/DOCKER_BRIDGE/operator-scoped devices are never touched.
      # Daily at 03:30 UTC by default.
      cron: ${DISCOVERY_PUBLIC_DEVICE_PRUNE_CRON:0 30 3 * * *}
      enabled: ${DISCOVERY_PUBLIC_DEVICE_PRUNE_ENABLED:true}
      # ISO-8601 duration — a PUBLIC device unseen for this long is hard-deleted.
      ttl: ${DISCOVERY_PUBLIC_DEVICE_TTL:P14D}
    bpf-filter: ${DISCOVERY_BPF_FILTER:ip or ip6 or arp}
  graph:
    subnet-cap: ${GRAPH_SUBNET_CAP:64}
    vulns-per-pair-cap: ${GRAPH_VULNS_PER_PAIR_CAP:5}
    max-devices: ${GRAPH_MAX_DEVICES:1024}
    docker-host-ip: ${GRAPH_DOCKER_HOST_IP:192.168.68.51}
  integration:
    probe:
      connect-timeout-ms: ${INTEGRATION_PROBE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${INTEGRATION_PROBE_READ_TIMEOUT_MS:5000}
  ot:
    probe:
      connect-timeout-ms: ${OT_PROBE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${OT_PROBE_READ_TIMEOUT_MS:5000}
      total-timeout-ms: ${OT_PROBE_TOTAL_TIMEOUT_MS:10000}
      max-concurrent: ${OT_PROBE_MAX_CONCURRENT:8}
  docker:
    probe:
      connect-timeout-ms: ${DOCKER_PROBE_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${DOCKER_PROBE_READ_TIMEOUT_MS:5000}
      max-concurrent: ${DOCKER_PROBE_MAX_CONCURRENT:8}
      snmp:
        community: ${DOCKER_PROBE_SNMP_COMMUNITY:public}
        enabled: ${DOCKER_PROBE_SNMP_ENABLED:true}
        timeout-ms: ${DOCKER_PROBE_SNMP_TIMEOUT_MS:1500}
        retries: ${DOCKER_PROBE_SNMP_RETRIES:1}
      traefik:
        enabled: ${DOCKER_PROBE_TRAEFIK_ENABLED:true}
      portainer:
        enabled: ${DOCKER_PROBE_PORTAINER_ENABLED:true}
      cadvisor:
        enabled: ${DOCKER_PROBE_CADVISOR_ENABLED:true}
      k8s:
        enabled: ${DOCKER_PROBE_K8S_ENABLED:true}
      registry:
        enabled: ${DOCKER_PROBE_REGISTRY_ENABLED:true}
  taxii:
    base-url: ${TAXII_BASE_URL:}
    collection-id: ${TAXII_COLLECTION_ID:}
    username: ${TAXII_USERNAME:}
    password: ${TAXII_PASSWORD:}
    backoff-base-millis: 6000
  misp:
    base-url: ${MISP_BASE_URL:}
    api-key: ${MISP_API_KEY:}
    distribution: ${MISP_DISTRIBUTION:0}
    threat-level-id: ${MISP_THREAT_LEVEL_ID:2}
    backoff-base-millis: 6000
