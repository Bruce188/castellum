# Test datasource — strategy (a): H2 in PostgreSQL compatibility mode
# This allows @DataJpaTest and contextLoads to run without a live PostgreSQL instance.
spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

castellum:
  nvd:
    base-url: https://services.nvd.nist.gov/rest/json/cves/2.0
    api-key: ""
    request-interval-millis: 10
    results-per-page: 2000
  epss:
    feed-url: https://epss.cyentia.com/epss_scores-current.csv.gz
    timeout-seconds: 30
  kev:
    feed-url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  risk:
    refresh-cron: "-"
  discovery:
    default-duration-seconds: 30
    arp:
      proc-path: /proc/net/arp
    mdns:
      service-types: _workstation._tcp.local.,_http._tcp.local.
    pcap:
      enabled: false
    lldp:
      enabled: false
    cdp:
      enabled: false
    bpf-filter: arp
