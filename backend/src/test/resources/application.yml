# Test datasource — strategy (a): H2 in PostgreSQL compatibility mode
# This allows @DataJpaTest and contextLoads to run without a live PostgreSQL instance.
spring:
  profiles:
    active: test
  # Disable the Spring Boot auto-MockMvc result-printer. Printing async StreamingResponseBody
  # results races with the streaming dispatch thread reading/mutating response headers
  # (HeaderValueHolder stream-toList "End size N is less than fixed size M"), producing
  # intermittent errors that have nothing to do with the assertions. Tests that need the
  # dump can still opt in with .andDo(print()).
  test:
    mockmvc:
      print: none
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    # 'create' (not 'create-drop') is deliberate: every Spring context attaches to the same
    # shared in-memory database (jdbc:h2:mem:test). With 'create-drop' the FIRST @SpringBootTest
    # context to close drops every table, emptying the DB out from under any context still live
    # (and under background @Scheduled beans such as ScanRetryService), which surfaces as flaky
    # "Table ... not found (this database is empty)" errors whose victim shifts with test
    # ordering. 'create' rebuilds the schema at startup but never drops on close, so concurrent
    # contexts no longer wipe each other. @DataJpaTest slices roll back per test and are
    # unaffected.
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

castellum:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-1234
      ttl-seconds: 3600
  admin:
    username: ""
    password-hash: ""
  nvd:
    base-url: https://services.nvd.nist.gov/rest/json/cves/2.0
    api-key: ""
    request-interval-millis: 10
    results-per-page: 2000
  epss:
    feed-url: https://epss.cyentia.com/epss_scores-current.csv.gz
    timeout-seconds: 30
  kev:
    feed-url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  risk:
    refresh-cron: "-"
    poll-interval-millis: 3600000
  ot:
    probe:
      connect-timeout-ms: 500
      read-timeout-ms: 500
      total-timeout-ms: 1000
      max-concurrent: 4
  # Docker host probe runs inside scan execution against fixture IPs that do not exist on
  # the test host's network. Production timeouts (2 s TCP connect, 1.5 s x 2 SNMP) make the
  # probe of a single dead host take ~30 s, blowing the integration tests' await windows
  # whenever the host network silently drops packets instead of failing fast. Bound them
  # tightly (same rationale as ot.probe above) so the probe path still executes but is
  # deterministic.
  docker:
    probe:
      connect-timeout-ms: 200
      read-timeout-ms: 500
      snmp:
        timeout-ms: 100
        retries: 0
  discovery:
    default-duration-seconds: 30
    passive-sweep-cron: "-"
    arp:
      proc-path: /proc/net/arp
    mdns:
      service-types: _workstation._tcp.local.,_http._tcp.local.
    pcap:
      enabled: false
    lldp:
      enabled: false
    cdp:
      enabled: false
    bpf-filter: arp
